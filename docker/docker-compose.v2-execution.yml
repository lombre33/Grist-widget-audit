# Zone d'exécution durcie pour l'audit V2 (voir docs/ARCHITECTURE-V2.md).
#
# Construit et vérifié par GitHub Actions (.github/workflows/image-v2.yml,
# scénarios dans docker/ci/verifier.sh) : ce qui est éprouvé, et ce qui ne
# peut l'être que sur le VPS, est dans docker/README-V2-VERIFICATIONS.md.
# Construction à la main : `docker compose -p gwaudit-v2 -f
# docker/docker-compose.v2-execution.yml build` depuis n'importe où.

# Antoine a tranché le 2026-09-28 : soumission sans compte (anonyme, donc
# vigilance renforcée sur les URL soumises — voir resoudreCible()/
# validerHoteClone() côté gwaudit et egress-proxy ci-dessous, tous deux
# déjà conçus pour ce cas) et volume faible avec mise en attente si deux
# jobs arrivent en même temps : ça ferme la question Docker durci vs
# microVM (§6) en faveur du premier — une file qui sérialise à un job à la
# fois répond à la demande ET ferme l'exposition réelle documentée en §1
# (le nombre d'audits simultanés, pas leur durée). Cette sérialisation
# elle-même reste à écrire côté zone "site" (§5), hors de ce fichier.
services:
  execution-audit:
    # docker/execution/Dockerfile : Node + Chromium (image Playwright
    # officielle) + le même gwaudit que la V1. Le contexte est la RACINE du
    # dépôt, pas docker/execution : le Dockerfile copie bin/, src/,
    # ressources/ et package.json, qui n'existent pas sous docker/execution
    # (la version précédente, `build: ./execution`, ne pouvait pas
    # construire — vu à la première vraie construction, voir .dockerignore).
    build:
      context: ..
      dockerfile: docker/execution/Dockerfile
      args:
        - BASE_IMAGE   # facultatif : sans valeur dans l'environnement, le digest par défaut du Dockerfile s'applique
      labels:
        - org.opencontainers.image.revision=${GWAUDIT_REVISION:-inconnue}
    # Un conteneur = un seul job d'audit. L'orchestrateur (file d'attente,
    # hors de ce fichier) le démarre pour un job précis, lui passe l'URL
    # soumise en argument et détruit le conteneur ensuite — ne jamais le
    # laisser tourner pour un deuxième job.
    read_only: true
    tmpfs:
      # Tout le travail d'un job (clone, inventaire, harnais) tient ici,
      # purgé avec le conteneur. `exec` est nécessaire : Docker monte un
      # tmpfs en `noexec` par défaut, or l'axe D écrit son lanceur de
      # Chromium (lancer-chromium.sh) sous os.tmpdir() et l'exécute — sans
      # `exec`, le lancement échoue en EACCES (vu à la première vraie
      # exécution, l'axe D était alors indisponible). Contrepartie : un
      # fichier exécutable d'un dépôt cloné pourrait s'exécuter ici, mais
      # rien dans gwaudit n'exécute de fichier du dépôt audité, et le
      # conteneur reste sans capacité, sans réseau (hors proxy), en lecture
      # seule ailleurs, et détruit après le job.
      - /tmp:size=512m,mode=1777,exec
    # Pas d'UID numérique forcé ici : le Dockerfile fixe déjà USER pwuser
    # (l'utilisateur non root fourni par l'image Playwright officielle).
    # Superposer un UID choisi au hasard ferait tourner le conteneur sous
    # une identité qui ne correspond à aucune entrée passwd de l'image, ce
    # qui peut casser des chemins internes de Chromium (HOME, sandbox) —
    # à vérifier sur le VPS si un UID numérique explicite s'avère
    # nécessaire pour l'orchestrateur réel.
    security_opt:
      - no-new-privileges:true
      # Profil seccomp de Docker + création d'espaces de noms utilisateur, dont
      # le bac à sable natif de Chromium a besoin : sous le profil par défaut
      # Chromium refuse de démarrer (« No usable sandbox! »). Voir
      # execution/seccomp-chromium.md. Le chemin est relatif à ce fichier.
      - seccomp=./execution/seccomp-chromium.json
    cap_drop:
      - ALL
    cap_add:
      # Le profil ci-dessus n'autorise chroot() que si le conteneur détient
      # cette capacité (ensemble borné) ; le bac à sable de Chromium l'appelle
      # dans son propre espace de noms utilisateur. Pour pwuser (non root) elle
      # n'entre pas dans l'ensemble effectif : le noyau refuse toujours chroot()
      # hors de cet espace de noms. Vérifié : sans elle, Chromium abandonne
      # (« Check failed: sys_chroot ») ; avec elle, chrome://sandbox répond
      # « You are adequately sandboxed » (docker/ci/verifier.sh securite).
      - SYS_CHROOT
    # Ne jamais céder et remettre --no-sandbox si Chromium ne démarre pas :
    # ajouter une couche d'isolation indépendante (conteneur jetable + réseau
    # fermé ci-dessous, voire une microVM plus tard) à la place. Attention :
    # Playwright ajoute LUI-MÊME --no-sandbox tant qu'on ne lui demande pas
    # chromiumSandbox: true — gwaudit le demande par défaut ; l'absence de
    # variable de dérogation ne prouvait rien, seuls les arguments du vrai
    # processus le prouvent (docker/ci/verifier.sh).
    pids_limit: 128
    mem_limit: 768m
    # Sans ceci Docker autorise autant de swap que de mémoire (le double au
    # total) quand l'hôte en a : la limite ne limiterait alors que la RAM.
    memswap_limit: 768m
    cpus: "1.0"
    networks:
      - reseau-ferme   # pas de route par défaut vers Internet
    environment:
      - HOME=/tmp
      # Sans ces deux variables, git clone et npm audit n'ont tout
      # simplement aucun moyen de sortir (reseau-ferme est "internal:
      # true", voir plus bas) — ce n'est pas une option, c'est ce qui fait
      # marcher le job. git respecte HTTP_PROXY/HTTPS_PROXY nativement
      # pour un remote https:// (aucune config supplémentaire côté
      # gwaudit) ; npm audit les reçoit via la liste explicite que
      # npmAudit() transmet à son environnement isolé (src/regles/
      # e-dependances.js, déjà en place). Manque relevé le 2026-09-28 par
      # une revue RSSI sur ce fichier, corrigé ici.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      # reseau-ferme n'a aucune résolution DNS externe : gwaudit ne peut pas
      # résoudre lui-même l'hôte d'une URL soumise (validerHoteClone, bin/
      # gwaudit.js) et le laisse résoudre, puis refuser une adresse interne,
      # par egress-proxy (acl « dst »). Sans cette variable, tout audit
      # d'URL échoue dès la première étape (exit 3) — constat de la CI.
      - GWAUDIT_RESOLUTION_PAR_PROXY=1
      # Aucune variable pour le bac à sable de Chromium : il est actif par
      # défaut dans gwaudit (chromiumSandbox: true, src/runtime/dynamique.js) et
      # la dérogation GWAUDIT_CHROMIUM_SANS_SANDBOX est refusée par
      # entrypoint.sh. Éprouvé par docker/ci/verifier.sh (arguments du vrai
      # processus Chromium pendant un audit, et chrome://sandbox).
      # Une URL git@hôte:chemin (SSH) ignore HTTP_PROXY/HTTPS_PROXY —
      # relevé par une revue. Pas un trou pour autant, et deux fois : avec
      # GWAUDIT_RESOLUTION_PAR_PROXY (ci-dessus) gwaudit refuse nettement une
      # URL SSH, et côté réseau reseau-ferme n'a de route que vers
      # egress-proxy — un SSH (port 22) n'a nulle part où aller, quelle que soit
      # la variable d'environnement (éprouvé : échec par « Could not resolve
      # hostname », alors que le même essai sur réseau ouvert atteint bien
      # github.com — docker/ci/verifier.sh proxy).
    volumes:
      - ./out:/out   # emplacement illustratif : l'orchestrateur (§5) choisit le vrai montage par job
    # Volontairement aucune variable héritée du service "site" (secrets,
    # clés API, identifiants base de données) : ce conteneur ne doit rien
    # détenir qui ait de la valeur en dehors du job qu'il traite.

  egress-proxy:
    build:   # docker/egress-proxy/Dockerfile + squid.conf : liste blanche par nom d'hôte (github.com, gitlab.com, registry.npmjs.org), éprouvée contre de vrais CONNECT par docker/ci/verifier.sh
      context: ./egress-proxy
      labels:
        - org.opencontainers.image.revision=${GWAUDIT_REVISION:-inconnue}
    # Pour les deux seules étapes qui ont besoin d'une vraie sortie réseau
    # (clonage git, npm audit — voir docs/ARCHITECTURE-V2.md §4). Refait sa
    # propre résolution DNS et rejette les plages privées/loopback/
    # lien-local (acl "dst" dans squid.conf) : ne se repose pas uniquement
    # sur la validation applicative de gwaudit. Pas de terminaison TLS
    # nécessaire (CONNECT tunnelise, ne casse pas le certificate pinning
    # git/npm).
    networks:
      - reseau-ferme
      - reseau-sortie-controlee

networks:
  reseau-ferme:
    internal: true   # aucune route par défaut vers l'extérieur : seul egress-proxy franchit la frontière
  reseau-sortie-controlee:
