# Zone d'exécution durcie pour l'audit V2 (voir docs/ARCHITECTURE-V2.md).
#
# ÉCRIT ET RELU ICI, JAMAIS CONSTRUIT NI DÉMARRÉ : la politique réseau de
# cet environnement cloud bloque Docker Hub (comme pour docker-compose.yml,
# l'instance Grist réelle) — `docker compose build`/`up` n'a donc jamais pu
# être exécuté sur ce fichier. À essayer en premier sur le VPS d'Antoine,
# en particulier le point le plus incertain : le sandbox natif de Chromium
# dans un conteneur Docker classique (voir la remarque dans le service
# execution-audit ci-dessous).
#
# Antoine a tranché le 2026-09-28 : soumission sans compte (anonyme, donc
# vigilance renforcée sur les URL soumises — voir resoudreCible()/
# validerHoteClone() côté gwaudit et egress-proxy ci-dessous, tous deux
# déjà conçus pour ce cas) et volume faible avec mise en attente si deux
# jobs arrivent en même temps : ça ferme la question Docker durci vs
# microVM (§6) en faveur du premier — une file qui sérialise à un job à la
# fois répond à la demande ET ferme l'exposition réelle documentée en §1
# (le nombre d'audits simultanés, pas leur durée). Cette sérialisation
# elle-même reste à écrire côté zone "site" (§5), hors de ce fichier.
services:
  execution-audit:
    build: ./execution   # docker/execution/Dockerfile : Node + Chromium (image Playwright officielle) + le même gwaudit que la V1, écrit mais jamais construit ici
    # Un conteneur = un seul job d'audit. L'orchestrateur (file d'attente,
    # hors de ce fichier) le démarre pour un job précis, lui passe l'URL
    # soumise en argument et détruit le conteneur ensuite — ne jamais le
    # laisser tourner pour un deuxième job.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777   # tout le travail d'un job (clone, inventaire, harnais) tient ici, purgé avec le conteneur
    # Pas d'UID numérique forcé ici : le Dockerfile fixe déjà USER pwuser
    # (l'utilisateur non root fourni par l'image Playwright officielle).
    # Superposer un UID choisi au hasard ferait tourner le conteneur sous
    # une identité qui ne correspond à aucune entrée passwd de l'image, ce
    # qui peut casser des chemins internes de Chromium (HOME, sandbox) —
    # à vérifier sur le VPS si un UID numérique explicite s'avère
    # nécessaire pour l'orchestrateur réel.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Pas de cap_add ici par défaut. Le sandbox natif de Chromium avec de
    # vrais namespaces utilisateur ne devrait pas exiger de capacité
    # élevée : si le Docker du VPS l'impose quand même, c'est le signal
    # qu'il faut une deuxième couche d'isolation indépendante de Chromium
    # (conteneur jetable + réseau fermé ci-dessous, voire une microVM plus
    # tard) plutôt que de céder et remettre --no-sandbox.
    pids_limit: 128
    mem_limit: 768m
    cpus: "1.0"
    networks:
      - reseau-ferme   # pas de route par défaut vers Internet
    environment:
      - HOME=/tmp
    volumes:
      - ./out:/out   # emplacement illustratif : l'orchestrateur (§5) choisit le vrai montage par job
    # Volontairement aucune variable héritée du service "site" (secrets,
    # clés API, identifiants base de données) : ce conteneur ne doit rien
    # détenir qui ait de la valeur en dehors du job qu'il traite.

  egress-proxy:
    build: ./egress-proxy   # docker/egress-proxy/Dockerfile + squid.conf : liste blanche par nom d'hôte (github.com, gitlab.com, registry.npmjs.org), écrit mais jamais construit ni testé contre un vrai CONNECT ici
    # Pour les deux seules étapes qui ont besoin d'une vraie sortie réseau
    # (clonage git, npm audit — voir docs/ARCHITECTURE-V2.md §4). Refait sa
    # propre résolution DNS et rejette les plages privées/loopback/
    # lien-local (acl "dst" dans squid.conf) : ne se repose pas uniquement
    # sur la validation applicative de gwaudit. Pas de terminaison TLS
    # nécessaire (CONNECT tunnelise, ne casse pas le certificate pinning
    # git/npm).
    networks:
      - reseau-ferme
      - reseau-sortie-controlee

networks:
  reseau-ferme:
    internal: true   # aucune route par défaut vers l'extérieur : seul egress-proxy franchit la frontière
  reseau-sortie-controlee:
