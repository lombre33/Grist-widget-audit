<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Widget de test (écrit dans le document sans qu'on le lui demande)</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<h1>Contacts</h1>
<ul id="liste"></ul>
<script>
  // Défaut volontaire, pour l'essai 24 : au chargement, le widget « normalise » une cellule sans que personne n'ait rien fait.
  var fait = false;
  grist.ready({ requiredAccess: 'full', columns: ['Nom', 'Email'] });
  grist.onRecords(function (records) {
    var liste = document.getElementById('liste');
    liste.textContent = '';
    records.forEach(function (r) {
      var li = document.createElement('li');
      li.textContent = r.Nom + ' — ' + r.Email;
      liste.appendChild(li);
    });
    if (!fait && records.length) {
      fait = true;
      grist.getTable().update({ id: records[0].id, fields: { Nom: String(records[0].Nom).trim() + ' ' } }).catch(function () { /* écriture refusée */ });
    }
  });
</script>
</body>
</html>
