<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Widget de test (garde les données dans le navigateur)</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<h1>Contacts</h1>
<ul id="liste"></ul>
<script>
  // Défaut volontaire, pour l'essai 23 : le widget « met en cache » les lignes reçues dans le stockage du navigateur.
  grist.ready({ requiredAccess: 'read table', columns: ['Nom', 'Email'] });
  grist.onRecords(function (records) {
    var liste = document.getElementById('liste');
    liste.textContent = '';
    records.forEach(function (r) {
      var li = document.createElement('li');
      li.textContent = r.Nom + ' — ' + r.Email;
      liste.appendChild(li);
    });
    try { localStorage.setItem('cache-contacts', JSON.stringify(records)); } catch (e) { /* stockage refusé */ }
    try { document.cookie = 'dernier-contact=' + encodeURIComponent(records[0] && records[0].Nom) + '; path=/; SameSite=None; Secure'; } catch (e) { /* cookie refusé */ }
  });
</script>
</body>
</html>
